<body>
<a class="sk" href="#ta">Skip to the code editor</a>
<div id="app">
<header><h1><span>HTML VIEWER</span></h1><button id="mb" aria-label="Menu" title="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="mn"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg></button></header>

<script>
"use strict";
const $=s=>document.querySelector(s),ta=$('#ta'),hlp=$('#hl'),gt=$('#gt'),ed=$('#ed'),M=$('#mk'),mn=$('#mn'),fin=$('#fin'),FL=$('#fl'),FF=$('#ff'),DE=document.documentElement;
const E=s=>s.replace(/[&<>]/g,c=>c=='&'?'&amp;':c=='<'?'&lt;':'&gt;');
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){}};
const FS=[11,12,13,14,16],VOID=new Set('area base br col embed hr img input link meta param source track wbr'.split(' ')),OPT=new Set('p li td th tr thead tbody tfoot option dt dd head body html colgroup'.split(' '));
const SAMPLE='<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <title>Hello</title>\n  <style>\n    body { background: #000; color: #3ddc84; font-family: sans-serif; text-align: center; }\n  </style>\n</head>\n<body>\n  <h1 id="t">Hello, world!</h1>\n  <button onclick="document.getElementById(\'t\').textContent=\'It works!\'">Click me</button>\n</body>\n</html>\n';
let LH=20,CW=8,lines=[''],sts=[0],rs=0,re=0,dirty=1,dg=2,mk=null,tt,ft,sv,sr,fi=(v=>v==null?2:+v)(ls('hv.fs')),ip;
let workspaces=[],activeId='',mode='html',keepCode=ls('hv.keep')==='1',previewHistory=false;
const editorData=()=>workspaces.find(x=>x.id===activeId);
const readMode=()=>{const e=editorData();return e?e[mode]||'':''};
function writeMode(v){const e=editorData();if(e)e[mode]=v}
function makeEditor(name='Editor',html='',css='',js=''){return{id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,html,css,js}}
function persist(){if(!keepCode)return;try{ls('hv.workspaces',JSON.stringify(workspaces));ls('hv.active',activeId);ls('hv.mode',mode)}catch(e){}}
function renderEditors(){
 const sel=$('#es');sel.innerHTML='';
 workspaces.forEach(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=e.name;sel.append(o)});
 sel.value=activeId;
 $('#lm').querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-selected',b.dataset.mode===mode?'true':'false')});
 ta.setAttribute('aria-label',TABN[mode]+' code');
}
function loadActive(){
 const e=editorData();if(!e)return;
 ta.value=e[mode]||'';renderEditors();upd();stat();ta.scrollTop=ta.scrollLeft=0;
}
function switchMode(next){if(!['html','css','js'].includes(next)||next===mode)return;writeMode(ta.value);mode=next;loadActive();persist()}
function addEditor(name='Editor'){
 writeMode(ta.value);const e=makeEditor(name);workspaces.push(e);activeId=e.id;mode='html';loadActive();persist();toast('New editor added')
}
function combinedSource(e=editorData()){
 if(!e)return '';
 let html=e.html||'';
 const css=e.css?'<style>\n'+e.css+'\n</style>':'';
 const js=e.js?'<script>\n'+e.js+'\n<\/script>':'';
 if(css){
  if(/<\/head\s*>/i.test(html))html=html.replace(/<\/head\s*>/i,css+'\n</head>');
  else if(/<head\b[^>]*>/i.test(html))html=html.replace(/<head\b[^>]*>/i,m=>m+'\n'+css);
  else if(/<!doctype[^>]*>/i.test(html))html=html.replace(/<!doctype[^>]*>/i,m=>m+'\n<head>'+css+'</head>');
  else html='<head>'+css+'</head>\n'+html;
 }
 if(/<\/body\s*>/i.test(html))html=html.replace(/<\/body\s*>/i,js+'\n</body>');
 else html+='\n'+js;
 return html;
}
function closeMainPreview(){
 if(!$('#pv').classList.contains('on'))return;
 $('#pv').classList.remove('on');$('#pf').srcdoc='';
 if(previewHistory){previewHistory=false;history.back()}
}
function openMainPreview(){
 writeMode(ta.value);$('#pf').srcdoc=combinedSource();$('#pv').classList.add('on');
 history.pushState({htmlViewerPreview:true},'','#preview');previewHistory=true;$('#px').focus();

    stack.push(el);
    if(tok.unclosed)el.unclosedTag=true;
  }

  function stray(tok,msg){
    err('e',tok.s,msg||('Closing </'+tok.raw+'> has no matching opening tag'));
    top().children.push({type:'stray',s:tok.s,e:tok.e,name:tok.name,raw:tok.raw});
  }

  function endTag(tok){
    curPos=tok.s;
    const name=tok.name;
    if(top().foreign){
      for(let k=stack.length-1;k>0;k--){
        const nd=stack[k];
        if(!nd.foreign)break;
        if(nd.name===name){reportUnclosedBetween(k,'</'+tok.raw+'>');while(stack.length>k+1)popImpl();const el=stack.pop();el.closed=true;el.e=tok.e;el.endTok=tok;return}
      }
    }
    if(H_VOID.has(name)){
      if(name==='br')err('e',tok.s,'</br> is not valid: write <br>');
      else err('e',tok.s,'<'+name+'> has no closing tag (it is a "void" element): remove </'+tok.raw+'>');
      top().children.push({type:'stray',s:tok.s,e:tok.e,name,raw:tok.raw,void:true});
      return;
    }
    let k=-1;
    if(name==='p'){
      if(!inScope('p',H_BTN_STOP)){stray(tok,'</p> has no matching <p> (a block tag such as <div> or <ul> inside a paragraph closes it early)');return}
    }
    for(let m=stack.length-1;m>0;m--){
      const nd=stack[m];
      if(nd.name===name&&!nd.foreign){k=m;break}
      if(!nd.foreign&&H_SCOPE_STOP.has(nd.name)&&name!=='table'&&name!=='td'&&name!=='th'&&name!=='tr'&&name!=='caption'){k=-1;break}
    }
    if(k<0){stray(tok);return}
    reportUnclosedBetween(k,'</'+tok.raw+'>');
    while(stack.length>k+1)popImpl();
    const el=stack.pop();el.closed=true;el.e=tok.e;el.endTok=tok;
  }

  for(const tok of toks){
    curPos=tok.s;
    switch(tok.t){
      case 'text':{
        const par=top();
        if(!par.foreign&&H_TEXT_BAD.has(par.name)&&par.type==='el'&&HNS.test(src.slice(tok.s,tok.e))&&!tok.bad)err('w',tok.s,'Text is not allowed directly inside <'+par.name+'>'+(par.name==='table'||par.name==='tr'||par.name==='tbody'||par.name==='thead'||par.name==='tfoot'?': the browser moves it out of the table':' (wrap it in the right tag)'));
        par.children.push({type:'text',s:tok.s,e:tok.e,bad:!!tok.bad});break;
      }
      case 'raw':top().children.push({type:'raw',s:tok.s,e:tok.e});break;
      case 'comment':top().children.push({type:'comment',s:tok.s,e:tok.e});break;
      case 'doctype':top().children.push({type:'doctype',s:tok.s,e:tok.e});break;
      case 'cdata':
        if(!top().foreign)err('w',tok.s,'<![CDATA[ ... ]]> only works inside <svg> or <math>; in HTML it becomes a comment');
        top().children.push({type:'cdata',s:tok.s,e:tok.e});break;
      case 'start':startTag(tok);break;
      case 'end':endTag(tok);break;
    }
  }
  curPos=src.length;
  const openNames=stack.slice(1).map(el=>el.raw);
  for(let k=stack.length-1;k>0;k--){
    const el=stack[k];
    if(!H_END_OPT.has(el.name)&&!el.tag.unclosedRaw)err('e',el.tag.s,'<'+el.name+'> is never closed (add </'+el.raw+'>)');
  }
  while(stack.length>1)popImpl();
  return {root,errs,toks,hasDoctype,ids,openNames};
}

/* ---- formatter ---- */
const H_BLOCK=W('address article aside blockquote body caption center col colgroup dd details dialog dir div dl dt fieldset figcaption figure footer form h1 h2 h3 h4 h5 h6 head header hgroup hr html legend li link main menu meta nav noscript ol p pre search section summary table tbody td template tfoot th thead title tr ul base script style');
const H_STRUCT=W('svg math select datalist picture video audio object canvas map');
const H_STRUCT_EXCEPT=W('text tspan textpath a');
const H_VERBATIM=W('pre listing plaintext xmp textarea');
const H_JS_TYPE=/^(|module|(text|application)\/(x-)?(java|ecma)script|text\/jsx)$/i;

function domSig(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const toks=[],cms=[];
  const RAWT=W('pre textarea listing plaintext xmp');
  const NS_SVG='http://www.w3.org/2000/svg',NS_MATH='http://www.w3.org/1998/Math/MathML';
  const NOREND=W('source track param');
  const memo=new Map();
  const hasBlk=el=>{
    if(memo.has(el))return memo.get(el);
    let r=false;
    for(let c=el.firstElementChild;c;c=c.nextElementSibling){
      if((c.namespaceURI!==NS_SVG&&c.namespaceURI!==NS_MATH&&H_BLOCK.has(c.localName))||hasBlk(c)){r=true;break}
    }
    memo.set(el,r);return r;
  };
  const walk=(nd,mode,skipWs)=>{
    for(let c=nd.firstChild;c;c=c.nextSibling){
      if(c.nodeType===3){
        const d=c.data;
        if(skipWs&&!HNS.test(d))continue;
        toks.push({t:'t',raw:mode==='raw',v:mode==='raw'?d:mode==='css'?cssNorm(d):mode==='js'?d.replace(/[ \t\n\f\r]+/g,''):d.replace(/[ \t\n\f\r]+/g,' ')});
      }else if(c.nodeType===8){
        cms.push(c.data.replace(/[ \t\n\f\r]+/g,' ').replace(/^ | $/g,''));
      }else if(c.nodeType===1){
        const nm=c.localName,ln=nm.toLowerCase(),ns=c.namespaceURI;
        let tag='<'+nm;
        for(const a of c.attributes)tag+=' '+a.name+'='+JSON.stringify(a.value);
        tag+='>';
        const htmlEl=ns!==NS_SVG&&ns!==NS_MATH;
        const blk=nm==='br'||(htmlEl&&(H_BLOCK.has(nm)||NOREND.has(nm)||H_STRUCT.has(nm)||hasBlk(c)));
        toks.push({t:'o',v:tag,b:blk});
        const foreignStruct=!htmlEl&&!H_STRUCT_EXCEPT.has(ln)&&ln!=='foreignobject';
        const childMode=RAWT.has(nm)?'raw':nm==='style'?'css':nm==='script'?'js':mode;
        walk(nm==='template'&&c.content?c.content:c,childMode,foreignStruct||(H_STRUCT.has(nm)&&htmlEl));
        toks.push({t:'e',v:'</'+nm+'>',b:blk});
      }
    }
  };
  walk(doc.documentElement,'flow');
  const out=[];
  for(const t of toks){
    if(t.t==='t'){
      if(t.v==='')continue;
      const last=out[out.length-1];
      if(last&&last.t==='t'&&last.raw===!!t.raw)last.v+=t.v;else out.push({t:'t',v:t.v,raw:!!t.raw});
    }else out.push(t);
  }
  out.forEach(t=>{if(t.t==='t'&&!t.raw)t.v=t.v.replace(/ {2,}/g,' ')});
  const res=[];
  for(let k=0;k<out.length;k++){
    const t=out[k];
    if(t.t==='t'){
      let v=t.v;
      const p=out[k-1],nx=out[k+1];
      const inRaw=p&&p.t==='o'&&/^<(pre|textarea|listing|plaintext|xmp)[ >]/.test(p.v);
      if(!inRaw){
        if(!p||p.b)v=v.replace(/^ +/,'');
        if(!nx||nx.b)v=v.replace(/ +$/,'');
      }
      if(v!=='')res.push('T'+v);
    }else res.push('X'+t.v);
  }
  return res.join('\u0001')+'\u0002'+cms.join('\u0001');
}

function htmlFormat(src,unit,fmt){
  unit=unit||'  ';
  const P=htmlParse(src);
  const fatal=P.errs.find(e=>e.fatal);
  if(fatal){const e=new Error(fatal.msg);e.pos=fatal.pos;e.fatal=true;throw e}
  const out=[];
  const WIDTH=100;
  const ind=d=>unit.repeat(d);
  const txt=nd=>src.slice(nd.s,nd.e);
  const attrOf=(el,nm)=>{const a=el.attrs.find(x=>x.l===nm);return a?(a.v||''):null};

  const openTag=el=>{
    const t=el.tag;let s='<'+t.raw;
    for(const a of t.attrs)s+=' '+src.slice(a.s,a.e);
    if(t.selfClosing)s+=/[ \t\n\f\r]\/>$/.test(src.slice(t.s,t.e))?' />':'/>';else s+='>';
    return s;
  };
  const closeTag=el=>el.closed&&el.endTok?'</'+el.endTok.raw+'>':'';

  // elements that draw nothing but sit between text/inline content with no whitespace must stay glued there
  const NONREND=W('script style meta link base template');
  const markGlue=node=>{
    const list=node.children;if(!list)return;
    list.forEach((c,k)=>{
      if(c.type==='el'&&!c.foreign&&NONREND.has(c.name)){
        const p=list[k-1],nx=list[k+1];
        const touches=(x,before)=>{
          if(!x)return false;
          if(x.type==='text')return before?!HTRAIL.test(src.slice(x.s,x.e)):!HLEAD.test(src.slice(x.s,x.e));
          if(x.type==='el')return !x.foreign&&!H_BLOCK.has(x.name)&&!H_VERBATIM.has(x.name)||x.foreign;
          return x.type==='raw';
        };
        if(touches(p,true)||touches(nx,false))c._glue=true;
      }
      markGlue(c);
    });
  };
  markGlue(P.root);

  // classification
  const hasBlockDesc=el=>{
    if(el._hb!==undefined)return el._hb;
    let r=false;
    for(const c of el.children){
      if(c.type!=='el')continue;
      if((!c.foreign&&H_BLOCK.has(c.name))||hasBlockDesc(c)){r=true;break}
    }
    return el._hb=r;
  };
  const isBlockEl=el=>{
    if(el.foreign||el._glue)return false;
    if(H_BLOCK.has(el.name))return true;
    if(H_VERBATIM.has(el.name)&&el.name!=='textarea')return true;
    if(H_STRUCT.has(el.name))return false;
    return hasBlockDesc(el);
  };
  const isStruct=el=>(H_STRUCT.has(el.name)&&!el.foreign)||(el.name==='svg'||el.name==='math')||(el.foreign&&!H_STRUCT_EXCEPT.has(el.name)&&el.children.some(c=>c.type==='el'));
  const isBlockNode=nd=>nd.type==='el'&&isBlockEl(nd);
  // a comment/doctype with whitespace or a block around it can sit on its own line
  const standalone=(list,k)=>{
    const nd=list[k];
    if(nd.type==='doctype')return true;
    if(nd.type!=='comment')return false;
    const p=list[k-1],nx=list[k+1];
    if(!p||!nx)return true;
    if(isBlockNode(p)||isBlockNode(nx))return true;
    if(p.type==='text'&&HTRAIL.test(txt(p)))return true;
    if(nx.type==='text'&&HLEAD.test(txt(nx)))return true;
    return false;
  };

  const joinFlat=toks=>{let s='';toks.forEach((t,k)=>{s+=(k&&t.sp?' ':'')+t.t});return s};

  // inline tokens
  function tokensFor(nodes,st,toks,rel,list){
    nodes.forEach((nd,k)=>{
      const push=tk=>{if(st.forceBr){tk.br=true;st.forceBr=false}toks.push(tk)};
      if(nd.type==='text'){
        const t=txt(nd);
        const words=t.split(HSPLIT).filter(Boolean);
        if(!words.length){if(t.length)st.sp=true;return}
        if(HLEAD.test(t))st.sp=true;
        words.forEach((w,j)=>{push({t:w,sp:j>0||st.sp,ind:rel});st.sp=false});
        if(HTRAIL.test(t))st.sp=true;
      }else if(nd.type==='comment'||nd.type==='cdata'||nd.type==='doctype'||nd.type==='stray'){
        const ls0=src.lastIndexOf('\n',nd.s-1)+1,pre=src.slice(ls0,nd.s);
        push({t:txt(nd),sp:st.sp,ind:rel,cm:nd.type==='comment',ow:/^[ \t]*$/.test(pre)?pre.length:0});st.sp=false;
      }else if(nd.type==='el'){
        elTokens(nd,st,toks,rel,push);
      }else if(nd.type==='raw'){
        push({t:txt(nd),sp:st.sp,ind:rel,raw:true});st.sp=false;
      }
    });
  }
  function elTokens(el,st,toks,rel,push){
    const open=openTag(el),cl=closeTag(el);
    if(el.void||el.selfClosed){
      push({t:open,sp:st.sp,ind:rel});st.sp=false;
      if(el.name==='br'&&!el.foreign)st.forceBr=true;
      return;
    }
    if((H_VERBATIM.has(el.name)&&!el.foreign)||el._glue){
      push({t:src.slice(el.s,el.e),sp:st.sp,ind:rel,raw:true});st.sp=false;return;
    }
    if(!el.children.length){push({t:open+cl,sp:st.sp,ind:rel});st.sp=false;return}
    if(el.children.every(c=>c.type==='text'&&!HNS.test(txt(c)))&&(el.foreign||H_STRUCT.has(el.name))){push({t:open+cl,sp:st.sp,ind:rel});st.sp=false;return}
    if(isStruct(el)){
      const kids=el.children.filter(c=>!(c.type==='text'&&!HNS.test(txt(c))));
      const ft=[];tokensFor(kids,{sp:false},ft,0);
      if(ft.length)ft[0].sp=false;
      const flat=open+joinFlat(ft)+cl;
      if(cl&&flat.length<=60&&flat.indexOf('\n')<0&&!ft.some(t=>t.br)){
        push({t:flat,sp:st.sp,ind:rel});st.sp=false;return;
      }
      push({t:open,sp:st.sp,ind:rel});st.sp=false;
      kids.forEach(kd=>{
        const mark=toks.length;
        tokensFor([kd],{sp:false},toks,rel+1);
        if(toks.length>mark)toks[mark].br=true;
      });
      if(cl)push({t:cl,sp:false,ind:rel,br:true});
      return;
    }
    push({t:open,sp:st.sp,ind:rel});st.sp=false;
    tokensFor(el.children,st,toks,rel);
    if(cl){push({t:cl,sp:st.sp,ind:rel});st.sp=false}
  }

  function assemble(toks,depth){
    const lines=[];
    let cur=null,lineInd=0;
    const openL=i=>{cur='';lineInd=depth+i};
    const closeL=()=>{if(cur!==null&&cur!=='')lines.push((lineInd?ind(lineInd):'')+cur);cur=null};
    toks.forEach((t,k)=>{
      if(cur===null)openL(t.ind||0);
      else if(t.br){closeL();openL(t.ind||0)}
      else if(t.sp){
        const room=WIDTH-unit.length*lineInd-cur.length-1;
        if(t.t.indexOf('\n')<0&&t.t.length>room&&cur!==''){closeL();openL(t.ind||0)}else cur+=' ';
      }
      if(t.t.indexOf('\n')>=0){
        const parts=t.t.split('\n');
        cur+=parts[0];
        lines.push((lineInd?ind(lineInd):'')+cur);
        for(let j=1;j<parts.length-1;j++){
          let l=parts[j];
          if(t.cm){l=l.replace(/[ \t\n\f\r]+$/,'');const m=/^[ \t]*/.exec(l)[0].length;l=HNS.test(l)?ind(lineInd)+l.slice(Math.min(m,t.ow||0)):''}
          lines.push(l);
        }
        let last=parts[parts.length-1];
        if(t.cm){last=last.replace(/[ \t\n\f\r]+$/,'');const m=/^[ \t]*/.exec(last)[0].length;last=ind(lineInd)+last.slice(Math.min(m,t.ow||0))}
        cur=last;lineInd=0;
      }else cur+=t.t;
    });
    closeL();
    return lines;
  }

  let pendingBlank=false;
  const pushLines=(lines)=>{
    if(pendingBlank&&out.length&&out[out.length-1]!=='')out.push('');
    pendingBlank=false;
    lines.forEach(l=>out.push(l));
  };

  function layout(children,depth){
    let run=[];
    const flush=()=>{
      if(!run.length)return;
      const toks=[];const st={sp:false};
      tokensFor(run,st,toks,0);
      run=[];
      if(!toks.length)return;
      toks[0].sp=false;
      pushLines(assemble(toks,depth));
    };
    const list=children;
    list.forEach((nd,k)=>{
      if(nd.type==='text'&&!HNS.test(txt(nd))){
        if((txt(nd).match(/\n/g)||[]).length>=2&&!run.length)pendingBlank=true;
        if(run.length)run.push(nd);
        return;
      }
      if(nd.type==='el'&&isBlockEl(nd)){flush();emitBlock(nd,depth);return}
      if(standalone(list,k)){
        flush();
        if(nd.type==='comment'){
          const ls0=src.lastIndexOf('\n',nd.s-1)+1,pre=src.slice(ls0,nd.s);
          const ow=/^[ \t]*$/.test(pre)?pre.length:0;
          const toks=[{t:txt(nd),sp:false,ind:0,cm:true,ow}];
          pushLines(assemble(toks,depth));
        }else pushLines([ind(depth)+txt(nd).trim()]);
        return;
      }
      run.push(nd);
    });
    flush();
  }

  function emitCode(el,depth){
    const open=openTag(el),cl=closeTag(el);
    const raw=el.children.length?txt(el.children[0]):'';
    if(!raw.trim()){pushLines([ind(depth)+open+cl]);return}
    const type=(attrOf(el,'type')||'').trim().toLowerCase();
    let body=null;
    try{
      if(/<!\[CDATA\[/.test(raw)||/<\!--/.test(raw))body=null;
      else if(el.name==='style')body=fmt&&fmt.css?fmt.css(raw,depth+1):null;
      else if(H_JS_TYPE.test(type)&&type!=='text/jsx')body=fmt&&fmt.js?fmt.js(raw,depth+1):null;
      else if(/json|importmap|speculationrules/.test(type)){const j=JSON.stringify(JSON.parse(raw),null,unit.length);body=j.split('\n').map(l=>ind(depth+1)+l).join('\n')+'\n'}
    }catch(e){body=null}
    const lines=[ind(depth)+open];
    if(body!==null)lines.push(body.replace(/\n+$/,''));
    else{
      // keep the code exactly as written (only blank edges are trimmed)
      lines.push(raw.replace(/^[ \t]*\n/,'').replace(/[ \t\n\f\r]+$/,''));
    }
    if(cl)lines.push(ind(depth)+cl);
    pushLines(lines);
  }

  function emitBlock(el,depth){
    const open=openTag(el),cl=closeTag(el);
    if(H_VERBATIM.has(el.name)){pushLines([ind(depth)+src.slice(el.s,el.e)]);return}
    if(el.void||el.selfClosed){pushLines([ind(depth)+open]);return}
    if(el.name==='script'||el.name==='style'){emitCode(el,depth);return}
    const kids=el.children;
    if(!kids.length||kids.every(c=>c.type==='text'&&!HNS.test(txt(c)))){pushLines([ind(depth)+open+cl]);return}
    const allInline=kids.every((c,k)=>c.type==='text'||c.type==='raw'||(c.type==='el'&&!isBlockEl(c))||((c.type==='comment'||c.type==='cdata'||c.type==='stray')&&!standalone(kids,k)));
    if(allInline){
      const toks=[];const st={sp:false};
      tokensFor(kids,st,toks,0);
      if(toks.length)toks[0].sp=false;
      const flat=open+joinFlat(toks)+cl;
      if(depth*unit.length+flat.length<=WIDTH&&flat.indexOf('\n')<0&&!toks.some(t=>t.br)){pushLines([ind(depth)+flat]);return}
      pushLines([ind(depth)+open]);
      pushLines(assemble(toks,depth+1));
      if(cl)pushLines([ind(depth)+cl]);
      return;
    }
    pushLines([ind(depth)+open]);
    pendingBlank=false;
    layout(kids,depth+1);
    if(cl)pushLines([ind(depth)+cl]);
  }

  layout(P.root.children,0);
  const res=out.join('\n').replace(/[ \t\n\f\r]+$/,'')+'\n';
  if(typeof DOMParser!=='undefined'){
    if(domSig(res)!==domSig(src))throw new Error('Safety check failed (the page would render differently)');
  }
  return res;
}

/* ===== checker: puts HTML + CSS + JavaScript checks together ===== */
function lineIndex(src){const a=[0];for(let i=src.indexOf('\n');i>=0;i=src.indexOf('\n',i+1))a.push(i+1);return a}
function lineOf(idx,pos){let lo=0,hi=idx.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(idx[m]<=pos)lo=m;else hi=m-1}return lo+1}
let _decTa=null;
function decodeEnt(s){
  if(s.indexOf('&')<0)return s;
  try{_decTa=_decTa||document.createElement('textarea');_decTa.innerHTML=s;return _decTa.value}catch(e){return s}
}
const _entCache=new Map();
function knownEntity(name){
  if(_entCache.has(name))return _entCache.get(name);
  let ok=true;
  try{const t=document.createElement('textarea');t.innerHTML='&'+name+';';ok=t.value!=='&'+name+';'}catch(e){}
  _entCache.set(name,ok);return ok;
}
function cleanJsMsg(m){return String(m||'').replace(/^Uncaught\s+/,'').replace(/^SyntaxError:\s*/,'')}

/* Parses JavaScript the way a script tag does, WITHOUT running it, and reports the exact line.
   The code is wrapped in if(0){ ... } inside a Worker, so nothing in it can execute. */
function jsParse(code){
  return new Promise(resolve=>{
    let url=null,w=null,done=false,tm=0;
    const fin=r=>{
      if(done)return;done=true;clearTimeout(tm);
      try{w&&w.terminate()}catch(e){}
      try{url&&URL.revokeObjectURL(url)}catch(e){}
      resolve(r);
    };
    const fallback=()=>{
      try{new Function(code)}catch(e){if(e instanceof SyntaxError)return {line:(e.lineNumber&&e.lineNumber>0)?e.lineNumber:1,col:e.columnNumber||1,msg:cleanJsMsg(e.message),approx:true}}
      return null;
    };
    if(typeof Worker==='undefined'||typeof Blob==='undefined'||typeof URL==='undefined'||!URL.createObjectURL)return fin(fallback());
    const strict=/^\s*(?:\/\*[\s\S]*?\*\/\s*|\/\/[^\n]*\n\s*)*(['"])use strict\1/.test(code);
    const pre=(strict?'"use strict";':'')+'if(0){\n';
    const total=code.split('\n').length;
    try{
      url=URL.createObjectURL(new Blob([pre+code+'\n}\npostMessage(1)'],{type:'text/javascript'}));
      w=new Worker(url);
    }catch(e){return fin(fallback())}
    w.onmessage=()=>fin(null);
    w.onerror=ev=>{
      try{ev.preventDefault()}catch(e){}
      const raw=(ev.lineno||2)-1;
      let line=raw;
      if(line<1)line=1;if(line>total)line=total;
      let msg=cleanJsMsg(ev.message);
      if(raw>total)msg='Something is not finished: a bracket ( [ { or a quote was opened but never closed (the browser only noticed at the end of the code: "'+msg+'")';
      fin({line,col:ev.colno||1,msg});
    };
    tm=setTimeout(()=>fin(fallback()),4000);
  });
}

const SEV_ORDER={e:0,w:1,i:2};

async function checkHTMLSource(src){
  const items=[];
  if(!/\S/.test(src))return items;
  const P=htmlParse(src);
  const idx=lineIndex(src);const L=pos=>lineOf(idx,Math.max(0,Math.min(pos,src.length)));
  const add=(sev,pos,msg,kind,line)=>items.push({line:line||L(pos),col:line?1:Math.max(1,pos-src.lastIndexOf('\n',Math.max(0,pos)-1)),sev,msg,kind:kind||'HTML',tab:'html'});
  P.errs.forEach(e=>add(e.sev,e.pos,e.msg.replace(/\u0000(\d+)\u0000/g,(m,q)=>L(+q))));
  if(!P.hasDoctype)add('w',0,'Missing <!DOCTYPE html> at the top: without it the browser uses "quirks mode", which can change how the page looks','HTML',1);
  const startTags=P.toks.filter(t=>t.t==='start');
  const hasHtmlOrHead=startTags.some(t=>t.name==='html'||t.name==='head');
  if(hasHtmlOrHead){
    const htmlTag=startTags.find(t=>t.name==='html');
    if(htmlTag&&!htmlTag.attrs.some(a=>a.l==='lang'))add('i',htmlTag.s,'<html> has no lang attribute (for example <html lang="en">): it helps screen readers and translation');
    if(!startTags.some(t=>t.name==='title'))add('i',0,'The page has no <title>','HTML',1);
    if(!startTags.some(t=>t.name==='meta'&&t.attrs.some(a=>a.l==='charset'||(a.l==='http-equiv'&&/content-type/i.test(a.v||'')))))add('i',0,'No <meta charset="utf-8">: special characters may look wrong','HTML',1);
    if(!startTags.some(t=>t.name==='meta'&&t.attrs.some(a=>a.l==='name'&&/^viewport$/i.test(a.v||''))))add('i',0,'No <meta name="viewport" content="width=device-width, initial-scale=1">: the page may not fit phone screens','HTML',1);
  }
  const jobs=[];
  const stack=[P.root];
  while(stack.length){
    const nd=stack.pop();
    for(let k=nd.children.length-1;k>=0;k--){
      const c=nd.children[k];
      if(c.type==='el')stack.push(c);
    }
    for(const c of nd.children){
      if(c.type==='text'&&!c.bad){
        const t=src.slice(c.s,c.e);
        if(t.indexOf('&')>=0){
          const re=/&([a-zA-Z][a-zA-Z0-9]*);/g;let m;
          while((m=re.exec(t))){if(!knownEntity(m[1]))add('w',c.s+m.index,'Unknown character code &'+m[1]+'; (the browser shows it as plain text)')}

        for(const a of c.attrs){
          if(a.v==null||a.v==='')continue;
          if(a.l==='style'){
            cssDeclCheck(decodeEnt(a.v)).forEach(it=>add(it.sev,a.s,it.msg,'CSS',L(a.s)+it.line-1));
          }else if(/^on[a-z]+$/.test(a.l)){
            try{new Function('event',decodeEnt(a.v))}catch(e){if(e instanceof SyntaxError){const mm=cleanJsMsg(e.message);add('e',a.s,'Syntax error in '+a.n+'="…": '+(/Unexpected token '\}'|end of input/.test(mm)?'the code looks unfinished (check that every ( [ { and quote is closed)':mm),'JavaScript')}}
          }
        }
        if(c.name==='script'||c.name==='style'){
          const raw=c.children.find(x=>x.type==='raw');
          const hasSrc=c.attrs.some(a=>a.l==='src');
          if(!raw||!/\S/.test(src.slice(raw.s,raw.e)))continue;
          const code=src.slice(raw.s,raw.e);
          const base=L(raw.s);
          if(c.name==='style'){
            if(code.indexOf('<![CDATA[')>=0)continue;
            cssCheck(code).forEach(it=>add(it.sev,raw.s,it.msg,'CSS',base+it.line-1));
          }else{
            const type=((c.attrs.find(a=>a.l==='type')||{}).v||'').trim().toLowerCase();
            if(hasSrc)add('w',c.tag.s,'This <'+'script> has a src, so the code written inside it is ignored');
            if(type===''||/^(text|application)\/(x-)?(java|ecma)script$/.test(type)){
              if(code.indexOf('<![CDATA[')<0)jobs.push(jsParse(code).then(r=>{if(r)add('e',raw.s,'Syntax error: '+r.msg,'JavaScript',base+r.line-1)}));
            }else if(/json|importmap|speculationrules/.test(type)){
              try{JSON.parse(code)}catch(e){
                const m=/position (\d+)/.exec(e.message||'');
                const ln=m?base+(code.slice(0,+m[1]).split('\n').length-1):base;
                add('e',raw.s,'This JSON is not valid: '+cleanJsMsg(e.message),'JavaScript',ln);
              }
            }
          }
        }
      }
    }
  }
  await Promise.all(jobs);
  return items;
}

async function checkCSSSource(src){
  const items=[];
  if(!/\S/.test(src))return items;
  if(/<\/style/i.test(src)){
    const idx=lineIndex(src);const m=/<\/style/i.exec(src);
    items.push({line:lineOf(idx,m.index),sev:'e',msg:'"</style" inside CSS ends the style block early and breaks the page',kind:'CSS',tab:'css'});
  }
  cssCheck(src).forEach(it=>items.push({line:it.line,sev:it.sev,msg:it.msg,kind:'CSS',tab:'css'}));
  return items;
}

async function checkJSSource(src){
  const items=[];
  if(!/\S/.test(src))return items;
  const idx=lineIndex(src);
  const m=/<\/script/i.exec(src);
  if(m)items.push({line:lineOf(idx,m.index),sev:'e',msg:'"<\/script" inside JavaScript ends the script early and breaks the page (write <\\/script instead)',kind:'JavaScript',tab:'js'});
  const r=await jsParse(src);
  if(r)items.push({line:r.line,col:r.col,sev:'e',msg:'Syntax error: '+r.msg+' (the browser stops at the first error, so fix it and check again)',kind:'JavaScript',tab:'js'});
  return items;
}

function sortItems(items){
  return items.sort((a,b)=>a.line-b.line||SEV_ORDER[a.sev]-SEV_ORDER[b.sev]);
}
async function checkTab(tab,text){
  const r=tab==='html'?await checkHTMLSource(text):tab==='css'?await checkCSSSource(text):await checkJSSource(text);
  return sortItems(r);
}
async function checkAll(e){
  const parts=await Promise.all([checkHTMLSource(e.html||''),checkCSSSource(e.css||''),checkJSSource(e.js||'')]);
  return parts.map(sortItems).flat();
}

return {fmtJS,fmtCSS,htmlFormat,checkTab,checkAll,jsParse,cssPropList,htmlTags:()=>Array.from(H_ELEMENTS),openNames:s=>htmlParse(s).openNames,VOIDS:H_VOID};
})();

function lineOfPos(t,p){return t.slice(0,Math.max(0,p)).split('\n').length}
async function fmtRun(){
  const src=ta.value,md=mode;
  if(!/\S/.test(src)){toast('Nothing to format');return}
  const u=IND();
  const FMT={css:(t,d)=>HV.fmtCSS(t,u,d),js:(t,d)=>HV.fmtJS(t,u,d)};
  let out,problem='';
  try{
    out=md==='html'?HV.htmlFormat(src,u,FMT):md==='css'?HV.fmtCSS(src,u):HV.fmtJS(src,u);
    // the formatted code must not contain more errors than the original
    const [a,b]=await Promise.all([HV.checkTab(md,src),HV.checkTab(md,out)]);
    const ne=l=>l.filter(x=>x.sev==='e'&&x.tab===md).length;
    if(ne(b)>ne(a))problem='Safety check failed: the formatted code would have more errors than your code.';
  }catch(err){
    const ln=err.line||(err.pos!=null?lineOfPos(src,err.pos):0);
    problem=(err.message||'Unknown problem')+(ln?' (line '+ln+')':'');
    if(err.fatal||err.line)problem+='. Fix this first — "Find mistakes" can help you find it.';
  }
  if(problem){
    dlg('Could not format',"<span>"+E(problem)+'</span><span class="note">Nothing was changed.</span>',[['Close'],['Find mistakes',()=>{setTimeout(()=>A.fix(),0)},1]]);
    return;
  }
  if(ta.value!==src){toast('The code changed while formatting. Try again.');return}
  if(out===src){toast('Already formatted');return}
  put(out);toast('Formatted '+TABN[md]);
}

function b64u(bytes){let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
async function packShare(e){
  const data={v:1,n:e.name||'Editor',h:e.html||'',c:e.css||'',j:e.js||''};
  const bytes=new TextEncoder().encode(JSON.stringify(data));
  if(typeof CompressionStream==='function'){
    try{
      const cs=new CompressionStream('deflate-raw'),w=cs.writable.getWriter();
      w.write(bytes);w.close();
      return 'z.'+b64u(new Uint8Array(await new Response(cs.readable).arrayBuffer()));
    }catch(err){}
  }
  return 'r.'+b64u(bytes);
}
async function unpackShare(kind,t){
  let bytes=unb64u(t);
  if(kind==='z'){
    if(typeof DecompressionStream!=='function')throw new Error('This browser cannot open compressed links');
    const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();
    w.write(bytes);w.close();
    bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer());
  }
  if(bytes.length>3e6)throw new Error('Too large');
  const d=JSON.parse(new TextDecoder().decode(bytes));
  if(!d||typeof d!=='object'||['h','c','j'].some(k=>typeof d[k]!=='string'))throw new Error('Bad data');
  return d;
}

/* ---------- opening, refreshing and closing the preview ---------- */
let jsOff=-1,jsLen=0;
function pvSrc(){
 const e=editorData();let s=combinedSource(e);jsOff=-1;
 if(e.js){const i=s.lastIndexOf('<script>\n'+e.js);if(i>=0){jsOff=s.slice(0,i).split('\n').length+NL;jsLen=e.js.split('\n').length}}
 const m=s.match(/^\s*<!doctype[^>]*>/i);return m?s.slice(0,m[0].length)+BOOT+s.slice(m[0].length):BOOT+s
}
function pvGo(){conClear();PF.srcdoc=pvSrc()}
const _close=closeMainPreview;

 writeMode(ta.value);pvGo();
 if(isOn())return;

};

ta.addEventListener('input',()=>{chg=1;if(PS.au&&isOn()&&isSp()){clearTimeout(rt);rt=setTimeout(()=>{writeMode(ta.value);pvGo()},700)}});

document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&isOn()&&isSp()&&!document.querySelector('.ov')){e.preventDefault();writeMode(ta.value);pvGo()}});
function goTo(m,line,a,b){if(!isSp())_close();if(mode!==m)switchMode(m);ta.focus({preventScroll:true});if(a!=null)show(a,b);else jump(line)}

/* ---------- console ---------- */
const LOG=$('#xcl');let nE=0,nW=0,sel=null;
function badge(){$('#xcn').textContent=(nE||nW)?'('+nE+' errors, '+nW+' warnings)':'';$('#xdt').textContent='Dev tools'+(nE?' ('+nE+')':'');$('#xdt').style.color=nE?'#ff8a80':''}
function conClear(){LOG.textContent='';nE=nW=0;badge()}
function filt(){const f=$('#xcf').value;LOG.querySelectorAll('.cr').forEach(r=>{r.hidden=!!f&&r.dataset.k!==f})}
function conAdd(d){
 const r=document.createElement('div'),k=d.k==='error'?'e':d.k==='warn'?'w':'';r.className='cr '+k;r.dataset.k=d.k;
 let line=0;if(d.l&&jsOff>0){const n=d.l-jsOff;if(n>=1&&n<=jsLen)line=n}
 r.textContent=(d.k==='error'?'✖ ':d.k==='warn'?'⚠ ':'')+d.m+(d.l?(line?'  — JavaScript tab, line '+line+(d.c?', column '+d.c:''):'  — page line '+d.l+(d.c?', column '+d.c:'')):'');
 if(line){r.tabIndex=0;r.title='Go to this line';r.dataset.l=line;r.classList.add('lk')}
 if(d.k==='error')nE++;else if(d.k==='warn')nW++;
 LOG.append(r);while(LOG.children.length>500)LOG.firstChild.remove();
 filt();badge();LOG.scrollTop=LOG.scrollHeight
}
$('#xcf').onchange=filt;$('#xcc').onclick=conClear;
LOG.onclick=e=>{const r=e.target.closest('.lk');if(r)goTo('js',+r.dataset.l)};
LOG.onkeydown=e=>{if(e.key==='Enter'){const r=e.target.closest('.lk');if(r)goTo('js',+r.dataset.l)}};
$('#xci').onkeydown=e=>{if(e.key!=='Enter')return;const v=e.target.value.trim();if(!v)return;conAdd({k:'log',m:'→ '+v});e.target.value='';if(PF.contentWindow)PF.contentWindow.postMessage({hv:1,t:'e',c:v},'*')};

/* ---------- element inspector ---------- */
function tab(t){PD.classList.add('on');$('#xdt').setAttribute('aria-pressed','true');$('#xcl').hidden=$('#xci').hidden=t!=='c';$('#xin').hidden=t!=='i';PD.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t?'true':'false'))}

function insp(on){$('#xpk').setAttribute('aria-pressed',on?'true':'false');if(PF.contentWindow)PF.contentWindow.postMessage({hv:1,t:'i',on:on},'*')}
$('#xpk').onclick=()=>{const on=$('#xpk').getAttribute('aria-pressed')!=='true';if(on){tab('i');pvSize()}insp(on)};
$('#xiu').onclick=()=>{if(PF.contentWindow)PF.contentWindow.postMessage({hv:1,t:'p'},'*')};
$('#xij').onclick=()=>{if(sel)locate(sel.tag,sel.n)};
function inspShow(d){
 sel={tag:String(d.tag||'').replace(/[^\w-]/g,''),n:d.n|0};
 $('#xia').textContent=String(d.path||'');$('#xih').textContent=String(d.html||'');
 const R=$('#xir'),C=$('#xic');R.textContent='';C.textContent='';
 const add=(el,t,bold)=>{const x=document.createElement(bold?'b':'div');x.textContent=t;el.append(x)};
 add(R,'CSS rules that apply (from your CSS and style tags)',1);
 if(Array.isArray(d.rules)&&d.rules.length)d.rules.forEach(r=>add(R,String(r)));else add(R,'None found');
 add(C,'Computed values',1);const css=Object(d.css);Object.keys(css).forEach(k=>add(C,k+': '+css[k]));
 tab('i');pvSize();insp(false)
}
function locate(tag,n){
 const s=(editorData().html||'').replace(CMT,m=>m.replace(/[^\n]/g,' ')).replace(/(<(script|style|textarea)\b[^>]*>)([\s\S]*?)(<\/\2\s*>)/gi,(m,a,b,c,d)=>a+c.replace(/[^\n]/g,' ')+d);
 const re=new RegExp('<'+tag+'(?=[\\s/>])','gi');let m,i=0,p=-1;
 while((m=re.exec(s))){if(i++===n){p=m.index;break}}
 if(p<0&&/^(html|head|body)$/.test(tag)){m=new RegExp('<'+tag+'(?=[\\s/>])','i').exec(s);if(m)p=m.index}
 if(p<0){toast('That element is not in the HTML tab (JavaScript may have created it)');return}
 goTo('html',null,p,p+tag.length+1)
}
addEventListener('message',e=>{
 if(e.source!==PF.contentWindow)return;const d=e.data;if(!d||d.hv!==1)return;
 if(d.t==='r')conClear();else if(d.t==='c')conAdd({k:String(d.k),m:String(d.m),l:d.l|0,c:d.c|0});else if(d.t==='s')inspShow(d)
});

/* ---------- editor management, naming, clear ---------- */
const askName=(title,def,cb)=>dlg(title,'<input type="text" id="enm" maxlength="60" aria-label="Name" value="'+E(def).replace(/"/g,'&quot;')+'">',[['Cancel'],['OK',()=>{cb($('#enm').value.trim()||def)},1]]);
$('#na').onclick=()=>askName('Name this editor','Editor '+(workspaces.length+1),n=>addEditor(n));
A.ren=()=>askName('Rename this editor',editorData().name,n=>{editorData().name=n;renderEditors();persist()});
A.dup=()=>{writeMode(ta.value);const s=editorData(),e=makeEditor(s.name+' copy',s.html,s.css,s.js);workspaces.push(e);activeId=e.id;loadActive();persist();toast('Editor duplicated')};
A.cls=()=>{if(workspaces.length<2){toast('This is your only editor. Use Clear all to start over.');return}
 const s=editorData();dlg('Close “'+E(s.name)+'”?','<p>The code in this editor will be removed. This cannot be undone.</p>',[['Cancel',null,1],['Close editor',()=>{const i=workspaces.indexOf(s);workspaces.splice(i,1);activeId=workspaces[Math.max(0,i-1)].id;loadActive();persist();toast('Editor closed')}]])};
A.clr=()=>dlg('Clear everything?','<p>This removes all editors and all code. '+(chg?'You have changes that were not exported. ':'')+'It cannot be undone. Export first if you want a copy.</p>',[['Cancel',null,1],['Clear all',()=>{workspaces=[makeEditor('Editor 1')];activeId=workspaces[0].id;mode='html';loadActive();persist();SS('hv.rec','');chg=0;toast('All editors cleared')}]]);

/* ---------- autosave recovery, leave-page warning ---------- */
const _save=save;
save=function(){_save();if(workspaces.some(w=>w.html||w.css||w.js))SS('hv.rec',JSON.stringify({w:workspaces,a:activeId,m:mode}))};
addEventListener('beforeunload',e=>{if(chg&&!keepCode&&workspaces.some(w=>w.html||w.css||w.js)){e.preventDefault();e.returnValue=''}});
document.addEventListener('click',e=>{const b=e.target.closest('.ov .pr');if(b&&/^Export/.test((b.closest('.bx').querySelector('b')||{}).textContent||''))chg=0},true);
try{
 const r=J(SS('hv.rec'),null),blank=workspaces.length===1&&!workspaces[0].html&&!workspaces[0].css&&!workspaces[0].js;
 if(r&&Array.isArray(r.w)&&blank&&(!location.hash||location.hash==='#preview')){
  const w=r.w.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string');
  if(w.length&&w.some(x=>x.html||x.css||x.js)){workspaces=w;activeId=w.some(x=>x.id===r.a)?r.a:w[0].id;mode=['html','css','js'].includes(r.m)?r.m:'html';renderEditors();loadActive();toast('Recovered your unsaved work')}
 }
}catch(e){}

/* ---------- safer import, recent files ---------- */
const rcGet=()=>J(keepCode?ls('hv.recent'):SS('hv.recent'),[]).filter(x=>x&&typeof x.n==='string'&&typeof x.c==='string'&&['html','css','js'].includes(x.m));
function rcAdd(n,m,c){if(c.length>3e5)return;const l=rcGet().filter(x=>x.n!==n);l.unshift({n,m,c});const j=JSON.stringify(l.slice(0,8));try{keepCode?ls('hv.recent',j):SS('hv.recent',j)}catch(e){}}
function openAs(name,m,text){const e=makeEditor(name);e[m]=text;writeMode(ta.value);workspaces.push(e);activeId=e.id;mode=m;loadActive();persist()}
fin.onchange=async()=>{const f=fin.files[0];if(!f)return;try{
 if(f.size>5e6&&!confirm('This file is '+(f.size/1e6).toFixed(1)+' MB. Large files can make the editor slow. Open it anyway?'))return;
 const text=await f.text(),h=text.slice(0,8192);
 if(h.includes('\0')||(h.match(/\uFFFD/g)||[]).length>8){toast('That looks like a binary file, not text');return}
 const ext=(f.name.split('.').pop()||'html').toLowerCase(),m=ext==='css'?'css':ext==='js'?'js':'html';
 openAs(f.name,m,text);rcAdd(f.name,m,text);toast('Imported into new editor: '+f.name)
}catch(x){toast('Could not read that file')}finally{fin.value=''}};
A.rcn=()=>{const l=rcGet();
 if(!l.length){dlg('Recent files','<p>No files yet. Files you import show up here'+(keepCode?'.':' for this browser session. Turn on “Keep code on reopen” to remember them longer.')+'</p>',[['Close',null,1]]);return}
 const o=dlg('Recent files','<div id="rcl"></div>',[['Close',null,1]]),box=o.querySelector('#rcl');
 l.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='rb';b.textContent=x.n+'  ('+(x.c.length/1024).toFixed(1)+' KB)';b.onclick=()=>{o.remove();openAs(x.n,x.m,x.c);toast('Opened '+x.n)};box.append(b)})};

/* ---------- code statistics and minify ---------- */
A.sta=()=>{const e=editorData(),rows=['html','css','js'].map(m=>{const s=e[m]||'';return '<tr><th scope="row">'+m.toUpperCase()+'</th><td>'+(s?s.split('\n').length:0)+'</td><td>'+s.length+'</td><td>'+(s.match(/\S+/g)||[]).length+'</td><td>'+new Blob([s]).size+'</td></tr>'}).join('');
 const h=e.html||'',tags=(h.match(/<[a-zA-Z][^>]*>/g)||[]).length,ids=(h.match(/\sid\s*=/gi)||[]).length,imgs=(h.match(/<img\b/gi)||[]).length,fn=((e.js||'').match(/\bfunction\b|=>/g)||[]).length,rules=((e.css||'').match(/\{/g)||[]).length;
 dlg('Code statistics (this editor)','<table class="kt st"><thead><tr><th></th><th>Lines</th><th>Chars</th><th>Words</th><th>Bytes</th></tr></thead><tbody>'+rows+'</tbody></table><span class="note">HTML tags: '+tags+' · ids: '+ids+' · images: '+imgs+' · CSS blocks: '+rules+' · JS functions: '+fn+'</span>',[['Close',null,1]])};
A.min=async()=>{const s=ta.value;if(!s.trim()){toast('Nothing to minify');return}
 let o;try{o=mode==='css'?minCSS(s):mode==='js'?minJS(s):minHTML(s)}catch(e){toast('Could not minify this code');return}
 if(mode==='js'&&await HV.jsParse(o)){toast('Minify stopped: the code has a syntax error, so nothing changed');return}
 if(o.length>=s.length){toast('Already compact');return}
 ta.focus();ta.select();if(!document.execCommand('insertText',false,o)){ta.value=o;ta.dispatchEvent(new Event('input'))}
 toast('Minified: '+(s.length/1024).toFixed(1)+' KB → '+(o.length/1024).toFixed(1)+' KB (Undo restores it)')};
A.spl=()=>{PS.sp=PS.sp?0:1;keepPS();layout();if(PS.sp&&!isOn())A.pv()};

/* ---------- checks: undefined functions, large files ---------- */
const TO={html:0,css:1,js:2},SO=(a,b)=>TO[a.tab]-TO[b.tab]||a.line-b.line||SEVR[a.sev]-SEVR[b.sev];
const _ct=HV.checkTab,_ca=HV.checkAll;
HV.checkTab=async(t,x)=>{const r=await _ct(t,x);if(t!=='js'||r.some(i=>i.sev==='e'))return r;try{return r.concat(undef(x,editorData().html||'')).sort(SO)}catch(e){return r}};
HV.checkAll=async e=>{const r=await _ca(e);if(r.some(i=>i.tab==='js'&&i.sev==='e'))return r;try{return r.concat(undef(e.js||'',e.html||'')).sort(SO)}catch(x){return r}};
const _ls=lintSoon;let big=0;
lintSoon=function(){if(ta.value.length>3e5){clearTimeout(lt);if(!big){big=1;toast('Large file: live checking is paused. Use Find mistakes when you need it.')}setPb(null);return}big=0;_ls()};

/* ---------- bracket and tag matching ---------- */
const BM=[0,1].map(()=>{const b=document.createElement('div');b.className='bm';ed.append(b);return b});let bmv=[null,null],bt;
function bmDraw(){BM.forEach((b,i)=>{const v=bmv[i];if(!v){b.style.display='none';return}b.style.cssText='display:block;width:'+v[2]*CW+'px;height:'+LH+'px;transform:translate('+((v[1]+dg)*CW+22-ta.scrollLeft)+'px,'+(v[0]*LH-ta.scrollTop)+'px)'})}
function bmFind(){
 bmv=[null,null];const v=ta.value;
 if(ta.selectionStart===ta.selectionEnd&&v.length<3e5){
  const p=ta.selectionStart,PR={'(':')','[':']','{':'}'},CLS={')':'(',']':'[','}':'{'};
  const i=(PR[v[p-1]]||CLS[v[p-1]])?p-1:(PR[v[p]]||CLS[v[p]])?p:-1;
  if(i>=0){
   const c=v[i],open=!!PR[c],t=open?PR[c]:CLS[c],st=open?1:-1;let d=0,j=i,hit=-1;
   for(let n=0;j>=0&&j<v.length&&n<50000;j+=st,n++){const x=v[j];if(x===c)d++;else if(x===t&&--d===0){hit=j;break}}
   if(hit>=0)bmv=[at(i).concat(1),at(hit).concat(1)]
  }else if(mode==='html'){
   const s=v.replace(CMT,x=>x.replace(/[^\n]/g,' ')).replace(/(<(script|style)\b[^>]*>)([\s\S]*?)(<\/\2\s*>)/gi,(x,a,b,c,d)=>a+c.replace(/[^\n]/g,' ')+d);
   const rx=/<(\/?)([A-Za-z][\w:-]*)\b[^>]*?(\/?)>/g,T=[];let m,cur=-1;
   while((m=rx.exec(s))){T.push({n:m[2].toLowerCase(),c:!!m[1],vd:VOID.has(m[2].toLowerCase())||!!m[3],L:m[2].length,o:m.index+1+(m[1]?1:0)});if(m.index<=p&&p<=m.index+m[0].length)cur=T.length-1}
   if(cur>=0&&!T[cur].vd){const t=T[cur],dir=t.c?-1:1;let d=0;for(let k=cur;k>=0&&k<T.length;k+=dir){const u=T[k];if(u.n!==t.n||u.vd)continue;d+=u.c===t.c?1:-1;if(d===0){if(k!==cur)bmv=[at(t.o).concat(t.L),at(u.o).concat(u.L)];break}}}
  }
 }
 bmDraw()}
const bmSoon=()=>{clearTimeout(bt);bt=setTimeout(bmFind,70)};
['keyup','pointerup','input','focus'].forEach(ev=>ta.addEventListener(ev,bmSoon));
ta.addEventListener('scroll',()=>requestAnimationFrame(bmDraw),{passive:true});
ta.addEventListener('blur',()=>{bmv=[null,null];bmDraw()});
$('#lm').addEventListener('click',bmSoon);$('#es').addEventListener('change',bmSoon);

/* ---------- floating preview stays on screen ---------- */
function flClamp(){const w=Math.min(FL.offsetWidth,innerWidth),h=Math.min(FL.offsetHeight,innerHeight);const l=Math.max(0,Math.min(FL.offsetLeft,innerWidth-w)),t=Math.max(0,Math.min(FL.offsetTop,innerHeight-h));FL.style.left=l+'px';FL.style.top=t+'px';FL.style.maxWidth=innerWidth+'px';FL.style.maxHeight=innerHeight+'px';ls('hv.fl',JSON.stringify([l,t,FL.offsetWidth,FL.offsetHeight]))}
new MutationObserver(()=>{if(!FL.classList.contains('on'))return;const s=J(ls('hv.fl'),null);if(Array.isArray(s)&&s.length===4&&s.every(Number.isFinite)){FL.style.left=s[0]+'px';FL.style.top=s[1]+'px';FL.style.width=Math.max(150,s[2])+'px';FL.style.height=Math.max(110,s[3])+'px'}flClamp()}).observe(FL,{attributes:true,attributeFilter:['class']});
['#fh','#fz'].forEach(q=>$(q).addEventListener('pointerup',()=>setTimeout(flClamp,0)));
